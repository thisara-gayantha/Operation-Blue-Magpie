# Operation Blue Magpie — CTFd reverse proxy + TLS termination

# HTTP :80 → redirect everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS :443 → terminate TLS, proxy to CTFd.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/obm.crt;
    ssl_certificate_key /etc/nginx/certs/obm.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Common proxy headers. X-Forwarded-Proto=https is critical: it makes CTFd
    # (running with REVERSE_PROXY=true) emit https asset URLs, so its JavaScript
    # loads correctly and the nav/top-bar buttons work.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    # CTFd's live notifications use Server-Sent Events on /events — this location
    # needs streaming (buffering off, long timeout). Normal pages keep buffering
    # ON so assets/JS are delivered reliably.
    location /events {
        proxy_pass http://ctfd_upstream;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://ctfd_upstream;
    }
}
